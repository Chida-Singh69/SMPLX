<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>🤟 Silentvoice ASL</h2>
    
    <label>
      <input type="checkbox" id="enableToggle" checked> Enable Overlay
    </label>
    
    <div class="setting">
      <label for="genderSelect">Avatar Gender:</label>
      <select id="genderSelect">
        <option value="neutral">Neutral</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>

    <div class="button-row">
      <button id="saveBtn">Save Settings</button>
      <button id="toggleBtn" type="button">Disable Overlay</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
